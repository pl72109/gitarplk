name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_SSH_PORT: ${{ vars.REMOTE_SSH_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p "$REMOTE_SSH_PORT" "${{ vars.REMOTE_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy files
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'docker-compose.yml' \
            --exclude 'data' \
            -e "ssh -p $REMOTE_SSH_PORT -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./ "${{ vars.REMOTE_USER }}@${{ vars.REMOTE_HOST }}:${{ vars.REMOTE_DIR }}/src/"
          rsync -az \
            -e "ssh -p $REMOTE_SSH_PORT -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./.github/docker/docker-compose.yml "${{ vars.REMOTE_USER }}@${{ vars.REMOTE_HOST }}:${{ vars.REMOTE_DIR }}/docker-compose.yml"

      - name: Deploy
        run: |
          ssh -p "$REMOTE_SSH_PORT" -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ vars.REMOTE_USER }}@${{ vars.REMOTE_HOST }}" \
            "set -e; \
             cd '${{ vars.REMOTE_DIR }}'; \
             docker compose build; \
             docker compose up -d"
